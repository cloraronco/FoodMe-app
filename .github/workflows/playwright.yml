name: Playwright

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installe les dépendances
        run: npm ci

      - name: Installe Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Lance les tests E2E
        run: npx playwright test

      - name: Publie le rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
